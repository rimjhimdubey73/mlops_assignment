name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-training:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests app.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Acquire dataset
        run: python -m src.data_acquisition

      - name: Train and track models
        run: python -m src.model_development

      - name: Build serving container
        run: docker build --tag heart-disease-api .

      - name: Start serving container
        run: docker run --detach --name heart-disease-api --publish 8000:8000 heart-disease-api

      - name: Smoke-test prediction endpoint
        run: |
          set -euo pipefail
          on_error() {
            exit_code=$?
            trap - ERR
            echo "Smoke test failed; serving container diagnostics:"
            docker ps -a || true
            docker logs heart-disease-api || true
            exit "$exit_code"
          }
          trap on_error ERR
          curl --retry 20 --retry-all-errors --retry-connrefused --retry-delay 2 --retry-max-time 60 --silent --show-error --fail http://localhost:8000/health
          response="$(curl --silent --show-error --fail --header 'Content-Type: application/json' --data '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' http://localhost:8000/predict)"
          python -c 'import json,sys; result=json.loads(sys.argv[1]); assert result["prediction"] in (0, 1); assert 0 <= result["confidence"] <= 1' "$response"
          curl --silent --show-error --fail http://localhost:8000/metrics | grep -q 'http_requests_total'

      - name: Stop serving container
        if: always()
        run: docker rm --force heart-disease-api || true

      - name: Upload training outputs and MLflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            reports/model_comparison.csv
            mlflow.db
            mlruns/
            models/
            reports/screenshots/
